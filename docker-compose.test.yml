# Local test only (not used by Railway): mirrors the template's variables.
services:
  mission-control:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: "3000"
      AUTH_USER: admin
      AUTH_PASS: ${AUTH_PASS:?set AUTH_PASS}
      MC_ALLOWED_HOSTS: localhost
    volumes:
      - mc-data:/app/.data
volumes:
  mc-data:
